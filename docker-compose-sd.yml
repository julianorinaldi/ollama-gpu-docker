# Stack completa: LLM (ollama) + geração de imagem (comfyui) + interface (open-webui).
#
# Use com o -f explícito, porque o docker-compose.yml padrão NÃO tem imagem:
#   docker compose -f docker-compose-sd.yml up -d
# ou, pelo Makefile:  make up-sd

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  ollama:
    <<: *gpu
    image: ollama/ollama:latest
    container_name: ollama
    env_file:
      - .env
    environment:
      # Permite que outros PCs na LAN acessem a API do Ollama.
      # Faz override do OLLAMA_HOST do .env (que é voltado ao Open WebUI).
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama

  # Substitui o antigo ai-dock/stable-diffusion-webui (AUTOMATIC1111), que nunca
  # chegou a subir aqui e ficou parado no upstream. O ComfyUI é o que segue
  # mantido, roda SDXL confortavelmente em 12 GB e expõe API HTTP em /prompt —
  # é assim que os scripts geram em lote, sem depender da interface.
  comfyui:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/Dockerfile.comfyui
    image: comfyui:local
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      # Checkpoints ficam fora de volumes/ porque volumes/ é root e este diretório
      # precisa ser gravável pelo usuário (é onde os .safetensors são baixados).
      - ./models/checkpoints:/opt/ComfyUI/models/checkpoints
      - ./models/loras:/opt/ComfyUI/models/loras
      - ./models/vae:/opt/ComfyUI/models/vae
      - ./saida:/opt/ComfyUI/output
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    env_file:
      - .env
    ports:
      - "3000:8080"
    volumes:
      - ./volumes/open-webui:/app/backend/data
    depends_on:
      - ollama
      - comfyui
